<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카토피아</title>
<style>
/* Bundled so the village keeps its look offline in the car (SIL OFL, see jua-OFL.txt). */
@font-face { font-family: 'Jua'; src: url('jua.woff2') format('woff2'); font-display: block; }
/* Theme A: cozy life-sim. Cream panels with a solid bottom shadow, brown ink, leaf-green actions. */
:root {
  color-scheme: light;
  --sea: #BEE5F2;
  --sheet: #FFF8EC;
  --sheet-2: #F6EBD3;
  --edge: #E8D6B8;
  --line: #EADBBD;
  --ink: #5B4636;
  --ink-2: #7E6855;
  --ink-3: #A08B76;
  --leaf: #3FAE6A;
  --leaf-dark: #2E8A51;
  --leaf-soft: #DDF3E3;
  --mile: #FFC93C;
  --warn: #C2410C;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --round: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--sea); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-variant-numeric: tabular-nums; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.round { font-family: var(--round); font-weight: 400; }
.cap { font-size: 15px; color: var(--ink-2); }
.pill { background: var(--sheet); border-radius: 999px; box-shadow: 0 4px 0 var(--edge), 0 10px 24px rgb(91 70 54 / .14); }
.sheet { background: var(--sheet); border-radius: 32px; box-shadow: 0 6px 0 var(--edge), 0 16px 32px rgb(91 70 54 / .16); }
.btn { height: 64px; border: 0; border-radius: 32px; font: 400 21px var(--round); padding: 0 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-p { background: var(--leaf); color: #FFFFFF; box-shadow: 0 6px 0 var(--leaf-dark); }
.btn-p:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--leaf-dark); }
.btn-p[disabled] { background: var(--sheet-2); color: var(--ink-3); box-shadow: none; cursor: default; }
.btn-s { background: var(--sheet-2); color: var(--ink); box-shadow: 0 4px 0 #E3CFA9; }
.btn-s:active { transform: translateY(2px); box-shadow: 0 2px 0 #E3CFA9; }
.btn-s.sm { height: 56px; font-size: 18px; border-radius: 28px; }
.icon-btn { width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--sheet-2); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #E3CFA9; }
.icon-btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 16px; border: 0; border-radius: 22px; background: #FFFFFF; box-shadow: 0 3px 0 #EFE2CC; text-align: left; width: 100%; }
.ic { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.bar { height: 12px; border-radius: 6px; background: #F1E4CC; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: #5CC27E; }
.chip { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--sheet-2); font-size: 14px; font-weight: 700; color: var(--ink-2); }
.chip.green { background: var(--leaf-soft); color: #2F7F50; }
.chip.blue { background: #DCEFFA; color: #2C6E91; }
.chip .dot { width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; flex: none; }
.ln { display: flex; justify-content: space-between; gap: 12px; font-size: 17px; padding: 3px 0; }
.ln span:first-child { color: var(--ink-2); }
.hr { height: 2px; background: var(--line); border-radius: 1px; }
/* trip summary: results only, no arithmetic */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats > div { background: #FFFFFF; border-radius: 18px; padding: 10px 14px; display: flex; flex-direction: column; gap: 0; box-shadow: 0 3px 0 #EFE2CC; }
.stats > div:last-child:nth-child(odd) { grid-column: 1 / -1; } /* three figures: the last one takes the whole row */
.stats .cap { font-size: 14px; }
.stats b { font-size: 30px; font-weight: 400; line-height: 1.2; white-space: nowrap; }
.stats b small { font-size: 17px; margin-left: 3px; color: var(--ink-2); }
.sumhead { display: flex; align-items: center; gap: 10px; }
.sumhead .coin { width: 38px; height: 38px; box-shadow: inset 0 -5px 0 #E8A417; }
.sumhead .round { font-size: 50px; line-height: 1.05; }
.sumhead .unit { font-size: 26px; color: var(--ink-2); align-self: flex-end; padding-bottom: 6px; }


/* item pictures in a row (home 아이템 list, trip summary) and growth stage dots */
.gain { display: flex; flex-direction: column; gap: 8px; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.dx { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, #CDEFFB 0%, #EAF8FD 55%, #FFF4DA 100%); display: flex; align-items: center; justify-content: center; color: #2F8F55; box-shadow: 0 2px 0 #EFE2CC; }
.dx.more { font-size: 20px; color: var(--ink-2); background: var(--sheet-2); }
.dex.big { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.dxi { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dxi .dx { width: 100%; aspect-ratio: 4 / 3; }
.dxi .round { font-size: 17px; }
.dxi .dx.off + .round { color: var(--ink-3); }
.dx img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dx.off img { filter: grayscale(1) brightness(1.15); opacity: .35; }
.dx .pips { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); background: rgb(255 248 236 / .9); padding: 3px 5px; border-radius: 8px; }
.pips { display: inline-flex; gap: 4px; align-items: center; flex: none; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: #E9DAC0; }
.pips i.on { background: #5CC27E; }
.grow { display: flex; align-items: center; gap: 12px; border-radius: 22px; background: #FFFFFF; padding: 14px 16px; box-shadow: 0 3px 0 #EFE2CC; }

/* preview buttons: a column in the side panel, one row in a split window */
.pv-act { display: flex; flex-direction: column; gap: inherit; }

/* edit mode */
#top { position: fixed; left: 20px; right: 20px; top: calc(20px + env(safe-area-inset-top, 0px)); height: 60px; display: flex; justify-content: space-between; pointer-events: none; }
#top > * { pointer-events: auto; }
#placePill { height: 60px; padding: 0 22px 0 8px; display: flex; align-items: center; gap: 12px; }
#placePill .gear { width: 44px; height: 44px; font-size: 22px; }
#placeName { font-size: 24px; white-space: nowrap; }
#placeName:empty { display: none; }
#placePill:has(#placeName:empty) { padding-right: 8px; }
.gear { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--sheet); font: 400 24px var(--round); display: flex; align-items: center; justify-content: center; flex: none; }
#miles { height: 60px; padding: 0 22px 0 16px; display: flex; align-items: center; gap: 8px; }
#miles .coin { width: 28px; height: 28px; }
#milesN { font-size: 28px; }
.coin { width: 24px; height: 24px; border-radius: 50%; background: var(--mile); box-shadow: inset 0 -4px 0 #E8A417; flex: none; }
#panel { position: fixed; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
#panel > * { flex-shrink: 0; } /* never squash a button; the panel scrolls instead */
/* after a drive: a large card on the left, the explored map beside it */
#panel.side { left: 24px; top: calc(24px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 48px); width: 540px; padding: 26px; gap: 18px; overflow-y: auto; }
body[data-view="summary"] #placePill { visibility: hidden; }
/* a card that follows the picked item on the map (placed by placeFloats) */
#panel.float { width: 360px; padding: 18px; left: 0; top: 0; }
#panel.float::before { content: ""; position: absolute; top: 50%; left: -12px; margin-top: -11px; border: 11px solid transparent; border-left: 0; border-right: 13px solid var(--sheet); }
#panel.float.flip::before { left: auto; right: -12px; border-right: 0; border-left: 13px solid var(--sheet); }
/* preview and move: one row at the bottom */
#panel.strip { left: 50%; bottom: 24px; transform: translateX(-50%); flex-direction: row; align-items: center; gap: 14px; padding: 12px 12px 12px 14px; white-space: nowrap; }
#panel.strip .btn { height: 60px; font-size: 20px; }
/* the item list above the bottom-right buttons */
#panel.pop { right: 20px; bottom: 112px; width: 400px; padding: 20px; }
#drawer { position: fixed; left: 20px; right: 20px; bottom: 20px; height: 230px; box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.dhead { display: flex; align-items: center; gap: 10px; }
.dhead .tabs { flex: 1 1 auto; min-width: 0; }
.dhead .icon-btn { width: 48px; height: 48px; flex: none; }
.tabs { display: flex; gap: 6px; overflow-x: auto; flex: none; }
.tab { height: 48px; padding: 0 18px; border: 0; border-radius: 24px; background: var(--sheet-2); font: 400 18px var(--round); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.cards { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 16px; }
.card { flex: none; width: 164px; height: 168px; box-sizing: border-box; border: 0; border-radius: 22px; background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; box-shadow: 0 3px 0 #EFE2CC; }
.card[aria-pressed="true"] { outline: 3px solid var(--leaf); background: #F2FAF3; }
.card.dim { opacity: .55; }
/* the chosen card opens up with its own button */
.card.wide { width: 316px; flex-direction: row; gap: 12px; padding: 10px; outline: 3px solid var(--leaf); background: #F2FAF3; }
.card.wide .wbody { display: flex; flex-direction: column; justify-content: space-between; flex: 1 1 auto; min-width: 0; gap: 6px; }
.card.wide .cta { height: 54px; font-size: 19px; padding: 0 12px; }
.card.wide .cta .coin { width: 18px; height: 18px; box-shadow: inset 0 -3px 0 #E8A417; }
.thumb { position: relative; flex: none; border-radius: 16px; background: linear-gradient(180deg, #CDEFFB 0%, #EAF8FD 55%, #FFF4DA 100%); color: #2F8F55; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; align-self: stretch; width: 100%; } /* the car WebView doesn't stretch rows inside a button */
.card .price { display: flex; align-items: center; gap: 4px; font: 400 16px var(--round); color: var(--ink); white-space: nowrap; }
.card .price .coin { width: 16px; height: 16px; box-shadow: inset 0 -3px 0 #E8A417; }
.card .thumb { align-self: stretch; }
.card .nm { font: 400 19px var(--round); color: var(--ink); }
.card .badge { margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: var(--sheet-2); color: var(--ink-2); }
.card .badge.ok { background: var(--leaf-soft); color: #2F7F50; }
#dock { position: fixed; left: 20px; bottom: 20px; display: flex; gap: 12px; }
#demo { height: 60px; }
#homeBtns { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 12px; }
#homeBtns[hidden] { display: none; }
#dexBtn { height: 76px; padding: 0 22px 0 12px; border: 0; display: flex; align-items: center; gap: 12px; color: var(--ink); }
#dexBtn .stack { display: flex; }
#dexBtn .stack img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid var(--sheet); background: #CDEFFB; }
#dexBtn .stack img + img { margin-left: -18px; }
#invBtn { position: relative; width: 76px; height: 76px; border: 0; display: flex; align-items: center; justify-content: center; color: #7C4DCC; }
#invBtn .n { position: absolute; right: 4px; top: 4px; min-width: 24px; height: 24px; border-radius: 12px; background: #7C4DCC; color: #FFFFFF; font: 400 15px var(--round); display: flex; align-items: center; justify-content: center; }
#tag { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 10px; white-space: nowrap; pointer-events: none; }
#tag::after { content: ""; position: absolute; left: 50%; bottom: -11px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top: 12px solid var(--sheet); }
#tag .dot { width: 12px; height: 12px; border-radius: 6px; flex: none; }
#tag b { font: 400 20px var(--round); color: var(--ink-2); }
#tag.warn { color: var(--warn); }
/* the summary's four figures in one row */
.figs { display: grid; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 14px 0; }
.figs > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.figs > div + div { border-left: 2px solid var(--line); }
.figs b { font: 400 36px var(--round); line-height: 1.1; white-space: nowrap; }
.figs b small { font-size: 19px; margin-left: 2px; color: var(--ink-2); }
.figs b.area { color: #2E8A51; }
.figs b.area small { color: #2E8A51; }
.figs span { font-size: 15px; color: var(--ink-2); }
#note { position: fixed; left: 50%; top: 104px; transform: translateX(-50%); padding: 12px 22px; font: 400 18px var(--round); white-space: nowrap; transition: opacity .3s; }

/* drive mode */
#dgear { position: fixed; left: 24px; top: 24px; padding: 10px 26px 10px 10px; display: flex; align-items: center; gap: 14px; }
#dgear .gear { width: 56px; height: 56px; font-size: 30px; }
#dpanel { position: fixed; right: 24px; top: 24px; width: 340px; box-sizing: border-box; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.l2 { font-size: 24px; color: var(--ink-2); }
.big { font: 400 32px var(--round); }
#toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 16px 30px; font: 400 26px var(--round); white-space: nowrap; box-shadow: 0 8px 24px rgb(91 70 54 / .3); transition: opacity .4s; }

/* saving */
#saving { position: fixed; inset: 0; background: rgb(255 248 236 / .55); display: flex; align-items: center; justify-content: center; }
#saving .sheet { width: 560px; box-sizing: border-box; padding: 34px 40px; display: flex; flex-direction: column; gap: 20px; }
.credit { position: fixed; left: 16px; bottom: 4px; font-size: 11px; color: #4F6E7A; pointer-events: none; }
body.edit .credit { left: auto; right: 24px; bottom: auto; top: calc(86px + env(safe-area-inset-top, 0px)); }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); background: var(--sea); font-size: 18px; }

/* one window of a split screen, next to the navigation app (Pleos runs two apps side by side, each in portrait) */
@media (max-width: 900px) {
  #top { left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); height: 52px; }
  #placePill { height: 52px; padding-left: 6px; }
  #placePill .gear { width: 40px; height: 40px; font-size: 20px; }
  #placeName { font-size: 20px; }
  #miles { height: 52px; padding: 0 16px 0 12px; }
  #milesN { font-size: 22px; }
  #drawer { left: 12px; right: 12px; bottom: 12px; height: 226px; }
  /* cards sit at the bottom, full width, instead of beside the map */
  #panel.side, #panel.float, #panel.strip { left: 12px; right: 12px; bottom: 12px; top: auto; width: auto; transform: none; }
  #panel.side { max-height: calc(100% - 84px); padding: 18px; gap: 12px; }
  #panel.float::before { display: none; }
  #panel.strip { flex-wrap: wrap; white-space: normal; }
  #panel.strip .btn { flex: 1 1 auto; }
  #panel.pop { right: 12px; left: 12px; width: auto; bottom: 100px; max-height: calc(100% - 180px); overflow-y: auto; padding: 14px; }
  .dex.big { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .dxi .round { font-size: 14px; }
  .sumhead .round { font-size: 42px; }
  .figs { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; row-gap: 10px; }
  .figs > div:nth-child(odd) { border-left: 0; }
  #homeBtns { right: 12px; bottom: 12px; }
  #dock { top: auto; bottom: 12px; left: 12px; }
  #demo { height: 52px; }
  #note { top: 76px; }
  body.edit .credit { left: auto; right: 16px; bottom: auto; top: calc(68px + env(safe-area-inset-top, 0px)); }
  body.drive .credit { left: auto; right: 12px; }
  #saving .sheet { width: auto; max-width: calc(100vw - 32px); }

  #dgear { left: 12px; top: auto; bottom: 16px; padding: 6px 20px 6px 6px; gap: 10px; }
  #dgear .gear { width: 44px; height: 44px; font-size: 24px; }
  #dgear .round { font-size: 24px !important; }
  #dpanel { left: 12px; right: 12px; top: 12px; width: auto; padding: 16px 20px; gap: 10px; border-radius: 26px; }
  #dpanel .l2 { font-size: 20px; }
  #dNew { font-size: 52px !important; }
  #dpanel .big { font-size: 28px; }
  #dpanel .hr { display: none; }
  #dpanel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; }
  #dpanel > :first-child { grid-column: 1 / -1; }
  #dpanel > div[style*="grid"] { display: contents !important; }
  #toast { bottom: 84px; max-width: calc(100vw - 32px); font-size: 22px; padding: 12px 22px; white-space: normal; }
}
</style>

<div id="stage" aria-label="실제 지도 위에 꾸민 마을"></div>
<div class="credit">지도 © OpenStreetMap contributors</div>

<!-- edit mode (parked) -->
<div id="edit" hidden>
  <header id="top">
    <div id="placePill" class="pill"><div class="gear" aria-label="기어 P">P</div><span class="round" id="placeName"></span></div>
    <div id="miles" class="pill" aria-live="polite"><span class="coin" aria-hidden="true"></span><span class="round" id="milesN">0</span></div>
  </header>

  <aside id="panel" class="sheet" aria-live="polite" hidden></aside>
  <section id="drawer" class="sheet" aria-label="꾸미기 아이템" hidden>
    <div class="dhead"><div class="tabs" role="tablist" id="tabs"></div><button type="button" class="icon-btn" id="drawerX" aria-label="닫기"></button></div>
    <div class="cards" id="cards"></div>
  </section>
  <div id="homeBtns">
    <button type="button" id="dexBtn" class="pill"></button>
    <button type="button" id="invBtn" class="pill" aria-label="보관함"></button>
  </div>

    <button type="button" id="demo" class="btn btn-s sm" hidden>주행 체험하기</button>

</div>

<!-- drive mode -->
<div id="drive" hidden>
  <div id="dgear" class="pill"><div class="gear" aria-label="기어 D">D</div><span class="round" style="font-size: 30px">주행 중</span></div>
  <div id="dpanel" class="sheet">
    <div><div class="l2">탐험 면적</div><div class="round" style="font-size: 64px; line-height: 1.1; color: #2F8F55" id="dNew">0</div></div>
    <div class="hr"></div>

</div>

<!-- P: automatic save -->

  <section class="sheet" aria-labelledby="sv-title">
    <div style="display: flex; align-items: center; gap: 14px">
      <div class="gear" aria-label="기어 P">P</div>

    </div>
  </section>
</div>

<div id="fail" hidden>마을 화면을 표시할 수 없어요. 앱을 다시 실행해 주세요.</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(async function () {
  const fail = () => { document.getElementById('fail').hidden = false; };
  if (!window.THREE || !THREE.OrbitControls) { fail(); return; }
  // Seoul in square tiles (tools/build_seoul.py): index + the blocks larger than a tile, the rest on demand
  const getJSON = (f) => fetch('../map/seoul/' + f).then((r) => { if (!r.ok) throw new Error(f); return r.json(); });
  let mapIndex, bigBlocks;
  try { [mapIndex, bigBlocks] = await Promise.all([getJSON('index.json'), getJSON('big.json')]); } catch (e) { fail(); return; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');

  // map pixel -> world; 10 px = 1 unit. (0,0)-(1280,720) is the old 응봉·성수 view; Seoul spreads around it
  const W = (x, y) => new THREE.Vector3(x / 10 - 64, 0, y / 10 - 36);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) { fail(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  let downAt = null, gest = null;
  const pickView = () => ui.view === 'home' || ui.view === 'dex' || ui.view === 'block' || ui.view === 'move';
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary) { if (gest) { gest = null; controls.enabled = mode === 'edit'; } return; } // a second finger: zoom or pan instead
    downAt = [e.clientX, e.clientY];
    if (mode !== 'edit' || !pickView()) return;
    const own = ui.view === 'move' ? ui.item : null, h = pickAt(e);
    const id = h.block != null ? h.block : null;
    if (id == null || !canPick(id, own)) return;
    gest = { x: e.clientX, y: e.clientY, id0: id, own, moved: false, key: '' };
    controls.enabled = false; // this finger selects; it does not turn the map
  }, { capture: true }); // runs before the camera controls see the same press
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!gest || !e.isPrimary) return;
    if (!gest.moved && Math.hypot(e.clientX - gest.x, e.clientY - gest.y) < 10) return;
    gest.moved = true;
    const ids = rangeIds(gest, e), key = ids.join(',');
    if (key !== gest.key) { gest.key = key; selectBlocks(ids, false); }
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!e.isPrimary) return;
    const g = gest; gest = null;
    if (mode === 'edit') controls.enabled = true;
    if (g && g.moved) { if (g.capped) note(`한 번에 ${MAX_SEL}곳까지 고를 수 있어요`); return; }
    if (mode !== 'edit' || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8) return;
    if (ui.view === 'preview') return; // finish or cancel the current step first
    const h = pickAt(e);
    if (ui.view === 'move') {
      const it = S.items.find((i) => i.id === ui.item);
      if (h.block == null && h.item !== it.id) { note('비어 있는 구역을 눌러 주세요'); return; }
      if (h.block != null) selectBlocks([h.block], false);
      return;
    }
    if (h.block != null && ui.view === 'block' && ui.sel.length > 1 && ui.sel.includes(h.block)) {
      return selectBlocks(ui.sel.filter((id) => id !== h.block), false); // tapping a block in the range takes it out
    }
    if (h.item != null) selectItem(h.item);
    else if (h.block != null) {
      if (!blocks.get(h.block).isle) { note('구역이 너무 좁아 꾸밀 수 없어요'); return; }
      if (!plot(blocks.get(h.block))) { note('구역이 너무 넓어 꾸밀 수 없어요'); return; }
      selectBlocks([h.block], true);
    } else if (ui.view !== 'home') toHome();
  });
  renderer.domElement.addEventListener('pointercancel', () => { gest = null; if (mode === 'edit') controls.enabled = true; });

  // ---------- messages from the app ----------
  // Android back: step back one panel; false lets the app close
  window.__back = () => {
    if (mode !== 'edit' || ui.view === 'home') return false; // the Android back key leaves the app from the home view
    toHome();
    return true;
  };
  window.__cartopia = (e) => {
    if (e.t === 'mode') setMode(e.mode);
    else if (e.t === 'car') { moveCar(e.x, e.y); if (mode === 'drive') car.visible = true; }
    else if (e.t === 'reveal') {
      e.ids.forEach((id) => revealed.add(id)); noteToday(e.ids);
      loadBlocks(e.ids).then(() => { touchTiles(e.ids); noteFound(e.ids); save(); });
      if (mode !== 'drive') render();
    }
    else if (e.t === 'trip') { trip = e; renderDrive(); }
    else if (e.t === 'miles') refreshMiles();
    else if (e.t === 'summary') {
      const grown = applyTrips(bridge ? JSON.parse(bridge.takeTrips()) : []);
      const unlocks = newUnlocks();
      save(); syncScene();
      setMode('edit');
      ui = { view: 'summary', tab: 'rec', summary: { ...e, grown, unlocks } };
      render();
      overviewAll();
    }
  };

  // ---------- resize + loop ----------
  // The camera's centre is moved to the middle of the map area that the top bar, panel and drawer leave open,
  // so the block the camera goes to is seen instead of sitting under the drawer.
  const viewOff = { x: 0, y: 0, tx: 0, ty: 0, fh: 0 };
  // The bubble sits over the top of the picked blocks and the item card beside the item, wherever the camera goes.
  const proj = new THREE.Vector3();
  const toPx = (v) => { proj.copy(v).project(camera); return [((proj.x + 1) / 2) * innerWidth, ((1 - proj.y) / 2) * innerHeight]; };
  function placeFloats() {
    if (mode !== 'edit') return;
    const t = $('tag');
    if (!t.hidden && tagIds.length) {
      const bs = tagIds.map((id) => blocks.get(id)).filter(Boolean);
      if (bs.length) {
        const x0 = Math.min(...bs.map((b) => b.bbox[0])), y0 = Math.min(...bs.map((b) => b.bbox[1])), x1 = Math.max(...bs.map((b) => b.bbox[2])), y1 = Math.max(...bs.map((b) => b.bbox[3]));
        const pts = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([x, y]) => toPx(W(x, y)));
        const sx = (Math.min(...pts.map((q) => q[0])) + Math.max(...pts.map((q) => q[0]))) / 2, sy = Math.min(...pts.map((q) => q[1]));
        t.style.left = `${clamp(sx, t.offsetWidth / 2 + 12, innerWidth - t.offsetWidth / 2 - 12)}px`;
        t.style.top = `${clamp(sy - 12, 150, innerHeight - 260)}px`;
      }
    }
    const p = $('panel');
    if (p.hidden || !p.classList.contains('float') || innerWidth <= 900) { p.style.left = p.style.top = ''; return; }
    const v = built.get(ui.item); if (!v) return;
    const [sx, sy] = toPx(tmp.set(v.at.x, v.h * 0.45, v.at.z));
    const w = p.offsetWidth, h = p.offsetHeight;
    let left = sx + 80, flip = false;
    if (left + w > innerWidth - 16) { left = sx - 80 - w; flip = true; }
    p.classList.toggle('flip', flip);
    p.style.left = `${clamp(left, 16, innerWidth - w - 16)}px`;
    p.style.top = `${clamp(sy - h / 2, 96, innerHeight - h - 16)}px`;
  }
  function measureFree() {
    const w = innerWidth, hh = innerHeight;
    viewOff.fh = hh;
    if (mode !== 'edit') { viewOff.tx = viewOff.ty = 0; return; }
    const f = { l: 0, r: w, t: $('top').getBoundingClientRect().bottom, b: hh };
    ['panel', 'drawer'].forEach((id) => {
      const el = $(id); if (el.hidden) return;
      if (id === 'panel' && !(el.classList.contains('side') || el.classList.contains('strip'))) return; // the floating card and the item list do not push the map
      if (id === 'panel' && el.classList.contains('strip')) { f.b = Math.min(f.b, el.getBoundingClientRect().top); return; }
      const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
      if (r.width > w * 0.6) { if ((r.top + r.bottom) / 2 < (f.t + f.b) / 2) f.t = Math.max(f.t, r.bottom); else f.b = Math.min(f.b, r.top); }
      else if ((r.left + r.right) / 2 > w / 2) f.r = Math.min(f.r, r.left); else f.l = Math.max(f.l, r.right);
    });
    viewOff.fh = f.b - f.t;
    if (f.b - f.t < 60) { viewOff.tx = viewOff.ty = 0; return; }
    viewOff.tx = w / 2 - (f.l + f.r) / 2; viewOff.ty = hh / 2 - (f.t + f.b) / 2;
  }
  function applyViewOff(k) {
    const x = viewOff.x + (viewOff.tx - viewOff.x) * k, y = viewOff.y + (viewOff.ty - viewOff.y) * k;
    if (Math.abs(x - viewOff.x) < 0.3 && Math.abs(y - viewOff.y) < 0.3 && k < 1) return;
    viewOff.x = x; viewOff.y = y;
    const w = stage.clientWidth, hh = stage.clientHeight;
    camera.setViewOffset(w, hh, x, y, w, hh);
    camera.updateProjectionMatrix();
  }
  function resize() {
    const w = stage.clientWidth, hh = stage.clientHeight;
    renderer.setSize(w, hh, false);
    camera.aspect = w / hh;
    measureFree();
    applyViewOff(1);
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  const tmp = new THREE.Vector3();
  const CAM_BACK = 20, CAM_UP = 22, CAM_AHEAD = 7; // world units (about 19 m each): behind and above the car, looking past it
  const turnToward = (a, b, k) => a + (Math.atan2(Math.sin(b - a), Math.cos(b - a)) * k);
  function place(el, at, y) {
    tmp.copy(at); tmp.y = y; tmp.project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
    el.style.display = vis ? '' : 'none';
    if (vis) el.style.transform = `translate(${((tmp.x + 1) / 2) * innerWidth}px, ${((1 - tmp.y) / 2) * innerHeight}px)${el.classList.contains('tag') ? ' translate(-50%, -100%)' : ''}`;
  }
  function tick() {
    const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
    const t = clock.elapsedTime;
    if (mode === 'drive' && carKnown) {
      // easing uses the real frame time (up to 1 s) so a slow head unit does not leave the camera trailing the car
      const dt = Math.min(raw, 1);
      // heading-up like a car navigation screen: the car always points up the screen and the map turns under it
      car.position.lerp(carGoal, 1 - Math.exp(-dt * 4));
      carHeading = turnToward(carHeading, goalHeading, 1 - Math.exp(-dt * 6));
      car.rotation.y = -carHeading;
      camHeading = camHeading === null ? carHeading : turnToward(camHeading, carHeading, 1 - Math.exp(-dt * 2.2));
      const fx = Math.cos(camHeading), fz = Math.sin(camHeading);
      const k = 1 - Math.exp(-dt * 2.5);
      controls.target.lerp(tmp.set(car.position.x + fx * CAM_AHEAD, 0, car.position.z + fz * CAM_AHEAD), k);
      camera.position.lerp(tmp.set(car.position.x - fx * CAM_BACK, CAM_UP, car.position.z - fz * CAM_BACK), k);
    } else if (tween) {
      tween.t = Math.min(1, tween.t + dt / 1.1);
      applyViewOff(1 - Math.pow(1 - tween.t, 3));
      const k = 1 - Math.pow(1 - tween.t, 3);
      camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
      controls.target.lerpVectors(tween.fromTarget, tween.toTarget, k);
      if (tween.t >= 1) tween = null;
    }
    if (!tween) applyViewOff(reduce ? 1 : 1 - Math.exp(-dt * 6));
    placeFloats();
    const camD = camera.position.distanceTo(controls.target);
    scene.fog.near = Math.max(90, camD * 1.3); scene.fog.far = Math.max(190, camD * 2.7);
    if (camera.far < camD * 3) { camera.far = camD * 3; camera.updateProjectionMatrix(); }
    if (!reduce) {
      animals.forEach((a, i) => {
        const o = a.obj, u = o.userData;
        if (a.wait > 0) {
          a.wait -= dt;
          u.head.rotation.z = -0.45 * Math.max(0, Math.sin(t * 2 + i));
          u.legs.forEach((l) => { l.rotation.z *= 0.8; });
          u.body.position.y = u.baseY;
          if (a.wait <= 0) {
            const p = randomInside(a.area, 0.9);
            // only accept goals whose straight path stays inside the block
            const ok = p && [0.25, 0.5, 0.75].every((f) => inside(a.area, o.position.x + (p.x - o.position.x) * f, o.position.z + (p.z - o.position.z) * f));
            if (ok) a.goal.set(p.x, o.position.y, p.z); else a.wait = 0.5;
          }
          return;
        }
        tmp.copy(a.goal).sub(o.position);
        const d = tmp.length();
        if (d < 0.1) { a.wait = 1.5 + Math.random() * 3; return; }
        const want = Math.atan2(-tmp.z, tmp.x);
        let diff = want - o.rotation.y;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        o.rotation.y += diff * Math.min(1, dt * 4);
        o.position.addScaledVector(tmp.normalize(), Math.min(d, a.speed * dt));
        u.head.rotation.z *= 0.9;
        const step = Math.sin(t * 12 + i);
        u.legs.forEach((l, j) => { l.rotation.z = (j % 2 ? 1 : -1) * step * 0.35; });
        u.body.position.y = u.baseY + Math.abs(step) * 0.08; // little hop while walking
      });
      swayers.forEach((s, i) => { const tr = s.obj; tr.userData.sway.rotation.z = Math.sin(t * 1.1 + i) * 0.035; tr.userData.sway.rotation.x = Math.cos(t * 0.9 + i) * 0.025; });
      docks.forEach(({ obj }) => {
        const dk = obj.userData;
        dk.bobber.position.y = 0.15 + Math.sin(t * 3.2) * 0.06 + (Math.sin(t * 0.7) > 0.85 ? -0.12 : 0);
        const rp = (t * 0.6) % 1;
        dk.ripple.scale.setScalar(0.6 + rp * 1.6);
        dk.ripple.material.opacity = 0.6 * (1 - rp);
        dk.boat.position.y = 0.25 + Math.sin(t * 1.4) * 0.05;
        dk.boat.rotation.z = Math.sin(t * 1.1) * 0.04;
      });
    }
    controls.update();
    sun.target.position.copy(controls.target); sun.position.copy(controls.target).add(SUN_OFF);
    sea.position.x = shadowCatcher.position.x = controls.target.x; sea.position.z = shadowCatcher.position.z = controls.target.z;
    updateTiles(); paintDirty();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  await loadBlocks(S.items.flatMap((it) => it.blocks));
  S.items = S.items.filter((it) => it.blocks.every((id) => blocks.has(id))); // items on blocks this map build no longer has
  if (bridge) { const late = JSON.parse(bridge.takeTrips()); if (late.length) applyTrips(late); }
  // terrain found so far; the first run on these rules reads every revealed tile once to catch up
  noteFound([...revealed]);
  if (!S.found || !S.seen) {
    S.found = S.found || [];
    loadBlocks([...revealed]).then(() => { noteFound([...revealed]); if (!S.seen) newUnlocks(); save(); if (mode === 'edit') render(); });
  }
  makeThumbs();
  syncScene();
  save();
  if (init.car) moveCar(init.car.x, init.car.y);
  setMode(init.mode || 'edit');
  if (init.mode === 'drive' && init.trip) { trip = init.trip; renderDrive(); }
  if (init.summary) window.__cartopia({ ...init.summary, t: 'summary' }); // a drive saved while the page was closed
  tick();
})();
</script>
